[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhighlightly"
version = "0.1.0"
description = "A typed Python client for Highlightly's NFL API (free-tier endpoint coverage)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Connor" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/cjkardokus/pyhighlightly"
Repository = "https://github.com/cjkardokus/pyhighlightly"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "respx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyhighlightly"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "respx",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pyhighlightly"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pyhighlightly"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
