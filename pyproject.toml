[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhighlightly"
version = "0.1.0"
description = "A typed Python client for Highlightly's NFL API, covering the free-tier endpoint surface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Connor", email = "cjkardokus@gmail.com" },
]
keywords = [
    "nfl",
    "american-football",
    "sports-api",
    "sports-data",
    "highlightly",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/cjkardokus/pyhighlightly"
Repository = "https://github.com/cjkardokus/pyhighlightly"

[tool.hatch.build.targets.wheel]
packages = ["src/pyhighlightly"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "respx",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pyhighlightly"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
# `files`, not `packages`: CI and the README both invoke `mypy .`, and an
# explicit path argument on the command line overrides `packages`/`files`
# from config -- so `packages = ["pyhighlightly"]` (src only) previously
# meant a bare `uv run mypy` checked something narrower than what CI
# actually runs. Removing `packages` outright isn't enough on its own --
# with no `files`/`packages`/`modules` set at all, a bare `mypy` has
# nothing to check and errors out instead of matching `mypy .`. Listing
# both directories here makes the two invocations agree.
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
