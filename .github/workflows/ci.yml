name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        # Pinned to an exact release, not a floating major tag: setup-uv
        # stopped publishing those after v7, so a bare `@v10` doesn't
        # exist to float on. This project's previous pin, `@v3`, was
        # frozen at a release old enough to predate the `python-version`
        # input outright -- that input was silently ignored rather than
        # erroring, so every job in this matrix actually ran under
        # whatever Python happened to be preinstalled on the runner,
        # regardless of `matrix.python-version` (confirmed on real CI
        # runs: all five jobs reported the same interpreter). Confirmed
        # against astral-sh/setup-uv's own README that this input (which
        # sets UV_PYTHON) is still the documented way to pin a version in
        # a matrix exactly like this one -- see its "Python version"
        # section.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  build-and-install:
    # Everything above type-checks and tests against the source tree
    # (mypy_path = "src" in pyproject.toml resolves imports straight from
    # `src/`, and pytest imports the editable install). Neither ever proves
    # the package a real user gets from `pip install` behaves the same way.
    # This job builds the actual wheel, installs *only* that wheel into a
    # venv with no knowledge of this repo's source layout or its
    # pyproject.toml, and checks it from there.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        # See the same step's comment in the `test` job above for why this
        # is pinned to an exact release rather than `@v3`.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: Build the package
        run: uv build

      - name: Create a clean install environment
        run: |
          uv venv "$RUNNER_TEMP/smoke-env"
          uv pip install --python "$RUNNER_TEMP/smoke-env" dist/*.whl mypy

      - name: Confirm the built wheel is importable from a clean install
        run: $RUNNER_TEMP/smoke-env/bin/python -c "import pyhighlightly"

      - name: Confirm type information ships with the wheel
        # Copies the checked-in throwaway script (see its own docstring) to
        # a directory outside the checkout before type-checking it, on
        # purpose: this repo's own pyproject.toml points mypy at `src/`
        # directly (see the comment above), which would silently mask a
        # packaging problem here. Run from a directory with no
        # pyproject.toml of its own, mypy has nothing to resolve the import
        # against except what the installed wheel actually ships. This is
        # the check that catches a missing `py.typed` marker -- without one,
        # every type in the package resolves to `Any` for downstream users
        # no matter how carefully it's annotated internally.
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cp .github/ci-smoke-test/check_types.py "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/smoke-env/bin/mypy" check_types.py
